name: CI and deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: |
          python -m compileall -q bot.py tests
          python -m py_compile deploy/check-systemd-policy

      - name: Check dependency lock
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          direct = {
              line.strip()
              for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          locked = set(re.findall(
              r"(?m)^([A-Za-z0-9_.-]+==[^ \\\n]+)",
              Path("requirements.lock").read_text(encoding="utf-8"),
          ))
          if direct != locked:
              raise SystemExit(f"requirements mismatch: direct={sorted(direct)} locked={sorted(locked)}")
          PY

      - name: Check deployment files
        run: |
          bash -n deploy/deploy-codex-limit-bot deploy/ssh-entrypoint
          shellcheck deploy/deploy-codex-limit-bot deploy/ssh-entrypoint
          python deploy/check-systemd-policy .
          getent passwd codexbot >/dev/null || sudo useradd --system --user-group --no-create-home codexbot
          getent passwd codexdeploy >/dev/null || sudo useradd --system --user-group --no-create-home codexdeploy
          sudo visudo -cf deploy/codex-limit-bot.sudoers
          sudo install -d /opt/codex-limit-bot/current/.venv/bin /opt/codex-limit-bot/shared/bin
          sudo install -m 0755 /bin/true /opt/codex-limit-bot/current/.venv/bin/python
          sudo install -m 0755 /bin/true /opt/codex-limit-bot/shared/bin/codex
          sudo install -m 0644 /dev/null /opt/codex-limit-bot/current/bot.py
          sudo install -m 0600 /dev/null /etc/codex-limit-bot.env
          sudo systemd-analyze verify ./codex-limit-bot.service ./codex-limit-bot-listener.service ./codex-limit-bot.timer
          ! git ls-files --eol deploy requirements.lock '*.service' '*.timer' '.github/workflows/*.yml' | grep -E 'w/(crlf|mixed)'

  deploy-production:
    name: Deploy exact main commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: codex-limit-bot-production
      cancel-in-progress: false

    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          [[ "$SSH_USER" == "codexdeploy" ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]

      - name: Prepare restricted SSH client
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/codex-deploy-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/codex-deploy-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/codex-deploy-ssh/known_hosts"

      - name: Deploy current main SHA
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/codex-deploy-ssh/key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/codex-deploy-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" "deploy $DEPLOY_SHA"

      - name: Remove temporary SSH files
        if: always()
        run: rm -rf "$RUNNER_TEMP/codex-deploy-ssh"
